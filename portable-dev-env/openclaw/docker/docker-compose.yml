services:
  openclaw:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openclaw
    restart: unless-stopped

    # --- Port binding (localhost only — never expose to 0.0.0.0 on host) ---
    ports:
      - "127.0.0.1:18789:18789"

    # --- Persistent storage ---
    volumes:
      - openclaw-config:/home/openclaw/.openclaw
      - openclaw-workspace:/home/openclaw/.openclaw/workspace
      - openclaw-logs:/home/openclaw/.openclaw/logs

    # --- Environment ---
    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - OPENCLAW_GATEWAY_HOST=0.0.0.0
      - OPENCLAW_GATEWAY_PORT=18789

    # --- Security hardening ---
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M,noexec,nosuid
      - /home/openclaw/.npm:size=50M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # --- Resource limits ---
    mem_limit: 2g
    mem_reservation: 512m
    cpus: "2.0"
    pids_limit: 256

    # --- Health check ---
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    # --- Logging ---
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openclaw-config:
    driver: local
  openclaw-workspace:
    driver: local
  openclaw-logs:
    driver: local
