name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: micnncim/action-label-syncer@v1
        with:
          labels: .github/labels.yml
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          delete: false
